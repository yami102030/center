                        emerald: {50: '#f6faf5', 100: '#ecf4ea', 200: '#d7e8d3', 300: '#bddab8', 400: '#a2ca9a', 500: '#8ebe84', 600: '#81b776', 700: '#6c9a63', 800: '#587c50', 900: '#466340'},

<style>
  :root{ --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --sub:#64748b; --border:#f1f5f9; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0b1120; --card:#1e293b; --text:#f1f5f9; --sub:#94a3b8; --border:#334155; }
  }
  :root[data-theme="dark"]{ --bg:#0b1120; --card:#1e293b; --text:#f1f5f9; --sub:#94a3b8; --border:#334155; }
  html,body{ height:100%; }
  body{
    background:var(--bg); color:var(--text);
    font-family:'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .sub{ color:var(--sub); }
  .brand{ display:inline-block; max-width:100%; }
  .tagline{ width:0; min-width:100%; white-space:nowrap; font-size:.9375rem; text-align:center; letter-spacing:.02em; }
  @media (min-width:640px){ .tagline{ font-size:1.0625rem; } }
  .entry-icon{ color:#8806ce; transition: transform .2s ease; }
  .entry:hover .entry-icon, .entry:focus-visible .entry-icon{ transform: translateY(-3px); }
  .entry:active .entry-icon{ transform: scale(.92); }
  .entry:focus-visible{ outline: 2px solid #8806ce; outline-offset: 4px; border-radius: .75rem; }
  @media (prefers-reduced-motion: reduce){ .entry-icon{ transition:none; } }

  /* ===== 守望花園 ===== */
  .garden-card{ background:var(--card); border:1px solid var(--border); box-shadow:0 4px 20px -2px rgba(136,6,206,.10); }
  .garden-track{ background:rgba(100,116,139,.20); }
  .garden-fill{ background:linear-gradient(90deg,#8806ce,#81b776); transition:width .8s ease; }
  .garden-glow{ background:radial-gradient(closest-side, rgba(193,126,230,.28), rgba(129,183,118,.12) 70%, transparent); }
  /* 枝葉擺動：每一株的幅度、速度、起點都不同，所以不會同步 */
  .sway{ animation:sway 5s ease-in-out infinite alternate; }
  @keyframes sway{ from{ transform:rotate(calc(var(--amp,1.5deg) * -1)); } to{ transform:rotate(var(--amp,1.5deg)); } }
  .seed-glow{ animation:glow 3.2s ease-in-out infinite; transform-origin:160px 199px; }
  @keyframes glow{ 50%{ transform:scale(1.25); } }
  .mote{ animation:mote 7s ease-in-out infinite; }
  @keyframes mote{ 0%{ transform:translate(0,6px); opacity:0; } 30%{ opacity:.9; } 70%{ opacity:.7; } 100%{ transform:translate(6px,-22px); opacity:0; } }
  .garden-skeleton{ animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 50%{ opacity:.45; } }
  @media (prefers-reduced-motion: reduce){
    .sway, .seed-glow, .mote, .garden-skeleton{ animation:none; }
    .garden-fill{ transition:none; }
  }
</style>
</head>

  <script>
  (function () {
    // 標語寬度最多為標題的 85%，若超過就自動縮小
    (function fitTagline(){
      var t = document.getElementById('tagline'); if (!t) return;
      var fit = function(){
        t.style.fontSize = '';
        var size = parseFloat(getComputedStyle(t).fontSize);
        var textW = function(){ var r = document.createRange(); r.selectNodeContents(t); return r.getBoundingClientRect().width; };
        while (textW() > t.clientWidth * 0.85 && size > 10) { size -= 0.5; t.style.fontSize = size + 'px'; }
      };
      fit();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
      window.addEventListener('resize', fit);
    })();

    // ==========================================
    // 守望花園設定：所有數字與文字都集中在這裡，要調整只改這一處
    // ==========================================
    var GARDEN = {
      SUPABASE_URL: "https://jcepavwocdujoeoqxvsd.supabase.co",
      SUPABASE_KEY: "sb_publishable_Tj2n8e3yY1HyvaFzXRyO_w_PWrVFB7E",
      RPC_NAME: "get_prayer_total",   // 資料庫函式：只回傳「已核准且公開」貼文的回應總數
      BANNER: '讓我們繼續用禱告灌溉，期待美好的花朵綻放',   // 進入新階段時顯示
      TIMEOUT_MS: 8000,
      REFRESH_AFTER_MS: 60000,        // 回到分頁時，超過這個時間才重新讀取
      // 階段：min 是該階段起算的次數（依小到大排列）
      STAGES: [
        { id: 'seed',   name: '種子睡著了', label: '種子睡著了', min: 0 },
        { id: 'sprout', name: '小芽冒出來', label: '小芽冒出來', min: 100 },
        { id: 'grow',   name: '小苗長大了', label: '小苗長大了', min: 500 },
        { id: 'bloom',  name: '花兒開了', label: '花兒開了', min: 1000 },
        { id: 'garden', name: '生命豐盛成長', label: '生命豐盛成長', min: 2000, full: 3000 }   // full：花園完全長成的次數
      ]
    };

    // ==========================================
    // 花園場景：用「成長進度 p」一次畫出整個畫面
    // p 的意思：0–1 播種、1–2 發芽、2–3 成長、3–4 開花、4–5 花園蔓延
    // 每個元素有自己的開始時間與緩動，所以不會同時出現、也不會機械式排列
    // ==========================================
    function buildScene(svg) {
      var NS = 'http://www.w3.org/2000/svg';
      function mk(tag, attrs, parent) {
        var e = document.createElementNS(NS, tag);
        for (var k in attrs) e.setAttribute(k, attrs[k]);
        if (parent) parent.appendChild(e);
        return e;
      }
      function c01(v) { return Math.max(0, Math.min(1, v)); }
      function eio(t) { t = c01(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }   // 慢—快—慢
      function eo(t) { t = c01(t); return 1 - Math.pow(1 - t, 3); }                                      // 先快後慢
      // 固定的亂數種子：每次看到的花園都長得一樣，但看起來自然不規則
      var seedN = 20261030;
      function rnd() {
        seedN = (seedN + 0x6D2B79F5) | 0;
        var t = Math.imul(seedN ^ (seedN >>> 15), 1 | seedN);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }
      function rr(a, b) { return a + (b - a) * rnd(); }
      function r1(n) { return Math.round(n * 10) / 10; }

      var GROUND_Y = 200;

      // ---- 莖：用曲線取樣，之後可以問「長到 f 的位置在哪、朝向哪裡」----
      function Stem(x, h, lean, bend) {
        var P = [
          { x: x, y: GROUND_Y },
          { x: x - bend, y: GROUND_Y - h * 0.38 },
          { x: x + lean * 0.85 + bend * 0.3, y: GROUND_Y - h * 0.72 },
          { x: x + lean, y: GROUND_Y - h }
        ];
        var N = 40, pts = [], cum = [0], i, t, u;
        for (i = 0; i <= N; i++) {
          t = i / N; u = 1 - t;
          pts.push({
            x: u * u * u * P[0].x + 3 * u * u * t * P[1].x + 3 * u * t * t * P[2].x + t * t * t * P[3].x,
            y: u * u * u * P[0].y + 3 * u * u * t * P[1].y + 3 * u * t * t * P[2].y + t * t * t * P[3].y
          });
          if (i > 0) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
        }
        var total = cum[N];
        this.d = 'M' + r1(P[0].x) + ' ' + r1(P[0].y) + 'C' + r1(P[1].x) + ' ' + r1(P[1].y) + ' ' + r1(P[2].x) + ' ' + r1(P[2].y) + ' ' + r1(P[3].x) + ' ' + r1(P[3].y);
        this.at = function (f) {
          var target = c01(f) * total, k = 1;
          while (k < N && cum[k] < target) k++;
          var seg = cum[k] - cum[k - 1] || 1, w = (target - cum[k - 1]) / seg;
          var a = pts[k - 1], b = pts[k];
          return { x: a.x + (b.x - a.x) * w, y: a.y + (b.y - a.y) * w, a: Math.atan2(b.x - a.x, -(b.y - a.y)) * 180 / Math.PI };
        };
      }

      function Leaf(parent, color) {
        var g = mk('g', {}, parent);
        mk('path', { d: 'M0 0C-7 -5 -9 -17 0 -27C9 -17 7 -5 0 0Z', fill: color }, g);
        mk('path', { d: 'M0 -3L0 -21', stroke: 'rgba(255,255,255,.28)', 'stroke-width': 0.8, 'stroke-linecap': 'round', fill: 'none' }, g);
        return g;
      }

      // ---- 花朵（含苞 → 花瓣一片一片展開）----
      function Head(parent, R, pal) {
        var g = mk('g', {}, parent);
        mk('ellipse', { cx: 0, cy: 0, rx: R * 0.2, ry: R * 0.13, fill: '#7aa96f' }, g);
        var petals = [];
        function petalPath(h) {
          var w = h * 0.34;
          return 'M0 0C' + r1(-w) + ' ' + r1(-h * 0.25) + ' ' + r1(-w * 1.05) + ' ' + r1(-h * 0.8) + ' 0 ' + r1(-h) +
                 'C' + r1(w * 1.05) + ' ' + r1(-h * 0.8) + ' ' + r1(w) + ' ' + r1(-h * 0.25) + ' 0 0Z';
        }
        function layer(n, spread, offset, len, c1, c2) {
          for (var i = 0; i < n; i++) {
            var norm = n === 1 ? 0 : (i / (n - 1)) * 2 - 1;
            var ang = norm * spread + offset + rr(-5, 5);
            var h = R * len * rr(0.92, 1.08);
            var el = mk('path', { d: petalPath(h), fill: i % 2 ? c1 : c2 }, g);
            petals.push({ el: el, ang: ang, str: Math.abs(norm) * 0.3 + rr(0, 0.08) });
          }
        }
        layer(8, 86, 0, 0.92, pal[0], pal[1]);   // 後排（深色）
        layer(7, 76, 0, 1.0, pal[1], pal[2]);    // 前排（淺色）
        var center = mk('ellipse', { cx: 0, cy: r1(-R * 0.06), rx: r1(R * 0.2), ry: r1(R * 0.14), fill: '#f6c453' }, g);
        return {
          g: g,
          set: function (bp, op) {
            var hb = eo(bp);
            if (hb <= 0.001) { g.setAttribute('opacity', 0); return; }
            g.setAttribute('opacity', 1);
            g.setAttribute('transform', 'scale(' + r1(hb * 100) / 100 + ')');
            for (var i = 0; i < petals.length; i++) {
              var o = eio((op - petals[i].str) / 0.65);
              petals[i].el.setAttribute('transform',
                'rotate(' + r1(petals[i].ang * (0.1 + 0.9 * o)) + ') scale(' + r1((0.7 + 0.3 * o) * 100) / 100 + ' ' + r1((0.62 + 0.38 * o) * 100) / 100 + ')');
            }
            var co = eio((op - 0.25) / 0.6);
            center.setAttribute('opacity', co);
            center.setAttribute('transform', 'scale(' + r1((0.3 + 0.7 * co) * 100) / 100 + ')');
          }
        };
      }

      // ---- 一株植物 = 莖 + 葉 + 花 ----
      var PALS = {
        purple:   ['#8806ce', '#a747db', '#c17ee6'],
        pink:     ['#d4609f', '#e58fc0', '#f4b8d9'],
        lavender: ['#8a72d8', '#a995ea', '#cfc3f6'],
        peach:    ['#e98a66', '#f3a98a', '#fac9b0']
      };
      var GREENS = ['#6c9a63', '#81b776', '#8ebe84', '#5f8c58'];

      function Plant(parent, o) {
        var root = mk('g', { 'class': 'sway' }, parent);
        root.style.transformOrigin = o.x + 'px ' + GROUND_Y + 'px';
        root.style.setProperty('--amp', o.amp + 'deg');
        root.style.animationDuration = o.dur + 's';
        root.style.animationDelay = '-' + o.delay + 's';
        var stem = new Stem(o.x, o.h, o.lean, o.bend);
        var path = mk('path', { d: stem.d, fill: 'none', stroke: '#6c9a63', 'stroke-width': o.sw, 'stroke-linecap': 'round', pathLength: 1, 'stroke-dasharray': 1, 'stroke-dashoffset': 1, opacity: 0 }, root);
        var leaves = [];
        for (var i = 0; i < o.leaves.length; i++) {
          var L = o.leaves[i];
          leaves.push({ el: Leaf(root, GREENS[Math.floor(rnd() * GREENS.length)]), f: L.f, side: L.side, ang: rr(36, 64), size: L.size });
        }
        var headPos = mk('g', {}, root);
        var head = Head(headPos, o.R, PALS[o.pal]);
        return {
          start: o.start, dur: o.dur2,
          update: function (sp, bp, op) {
            path.setAttribute('opacity', sp > 0.002 ? 1 : 0);
            path.setAttribute('stroke-dashoffset', r1((1 - sp) * 1000) / 1000);
            for (var i = 0; i < leaves.length; i++) {
              var L = leaves[i], lp = eio((sp - L.f) / 0.25);
              if (lp <= 0.001) { L.el.setAttribute('opacity', 0); continue; }
              var pos = stem.at(Math.min(L.f, sp));
              L.el.setAttribute('opacity', 1);
              L.el.setAttribute('transform', 'translate(' + r1(pos.x) + ' ' + r1(pos.y) + ') rotate(' + r1(pos.a + L.side * (10 + L.ang * lp)) + ') scale(' + r1(L.size * lp * 100) / 100 + ')');
            }
            var tip = stem.at(sp);
            headPos.setAttribute('transform', 'translate(' + r1(tip.x) + ' ' + r1(tip.y) + ') rotate(' + r1(tip.a * 0.6) + ')');
            head.set(bp, op);
          }
        };
      }

      function Blade(parent, x, h, lean, color, start, dur) {
        var g = mk('g', { 'class': 'sway' }, parent);
        g.style.transformOrigin = x + 'px 204px';
        g.style.setProperty('--amp', r1(rr(2, 4)) + 'deg');
        g.style.animationDuration = r1(rr(3.6, 6)) + 's';
        g.style.animationDelay = '-' + r1(rr(0, 5)) + 's';
        var p = mk('path', { d: 'M' + x + ' 204Q' + r1(x + lean * 0.3) + ' ' + r1(204 - h * 0.6) + ' ' + r1(x + lean) + ' ' + r1(204 - h), fill: 'none', stroke: color, 'stroke-width': r1(rr(1.8, 2.8)), 'stroke-linecap': 'round', pathLength: 1, 'stroke-dasharray': 1, 'stroke-dashoffset': 1, opacity: 0 }, g);
        return { start: start, dur: dur, set: function (q) { var e = eo(q); p.setAttribute('opacity', e > 0.002 ? 1 : 0); p.setAttribute('stroke-dashoffset', r1((1 - e) * 1000) / 1000); } };
      }

      // ================= 建立畫面 =================
      svg.innerHTML = '';
      var defs = mk('defs', {}, svg);
      var gg = mk('linearGradient', { id: 'soilGrad', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
      mk('stop', { offset: '0', 'stop-color': '#a98660' }, gg);
      mk('stop', { offset: '1', 'stop-color': '#7b5b40' }, gg);

      mk('ellipse', { cx: 160, cy: 207, rx: 150, ry: 20, fill: 'url(#soilGrad)' }, svg);
      mk('ellipse', { cx: 160, cy: 200, rx: 138, ry: 8, fill: '#b9966c', opacity: 0.55 }, svg);

      // 根（在土裡慢慢伸長）
      var roots = [];
      [['M160 203C158 209 153 213 148 218', 0.18], ['M160 203C163 210 168 212 173 217', 0.3], ['M160 203C160 210 159 214 161 220', 0.24]].forEach(function (r) {
        roots.push({ el: mk('path', { d: r[0], fill: 'none', stroke: '#d9c3a0', 'stroke-width': 1.6, 'stroke-linecap': 'round', pathLength: 1, 'stroke-dasharray': 1, 'stroke-dashoffset': 1, opacity: 0 }, svg), s: r[1] });
      });

      // 種子
      var seedG = mk('g', {}, svg);
      var seedGlow = mk('circle', { cx: 160, cy: 199, r: 12, fill: '#f6e7a0', opacity: 0 }, seedG);
      seedGlow.setAttribute('class', 'seed-glow');
      var seedBody = mk('g', { transform: 'translate(160 199)' }, seedG);
      var seedInner = mk('g', {}, seedBody);
      mk('ellipse', { cx: 0, cy: 0, rx: 9, ry: 6, fill: '#6b4f36', transform: 'rotate(-15)' }, seedInner);
      mk('ellipse', { cx: -3, cy: -2, rx: 3, ry: 1.6, fill: '#8d6c4d', transform: 'rotate(-15)' }, seedInner);
      // 前面一小撮土，蓋住種子下半部
      mk('path', { d: 'M146 203Q160 196 174 203Z', fill: '#9a7653' }, svg);

      // 背景小草
      var blades = [];
      for (var b = 0; b < 22; b++) {
        var bx = r1(rr(24, 296)), ds = Math.abs(bx - 160) / 160;
        var blade = Blade(svg, bx, rr(13, 30), rr(-9, 9), GREENS[Math.floor(rnd() * 4)], 4.0 + ds * 0.6 + rr(0, 0.08), 0.32);
        blades.push(blade);
      }

      // 其他花：位置、高度、大小、顏色都手排，刻意不對稱
      var secondary = [
        { x: -120, h: 50,  R: 11, pal: 'lavender', back: 1 },
        { x: -95,  h: 72,  R: 15, pal: 'pink',     back: 1 },
        { x: -62,  h: 104, R: 20, pal: 'peach',    back: 1 },
        { x: -78,  h: 38,  R: 9,  pal: 'purple',   back: 0 },
        { x: -30,  h: 60,  R: 12, pal: 'pink',     back: 0 },
        { x: 28,   h: 80,  R: 14, pal: 'lavender', back: 0 },
        { x: 45,   h: 40,  R: 9,  pal: 'peach',    back: 0 },
        { x: 62,   h: 110, R: 21, pal: 'pink',     back: 1 },
        { x: 98,   h: 66,  R: 16, pal: 'purple',   back: 1 },
        { x: 124,  h: 54,  R: 12, pal: 'lavender', back: 0 }
      ];
      var layerBack = mk('g', {}, svg), layerMain = mk('g', {}, svg), layerFront = mk('g', {}, svg);
      var plants = [];
      secondary.forEach(function (s) {
        var x = 160 + s.x, ds = Math.abs(s.x) / 160;
        var leavesDef = [{ f: 0.3, side: -1, size: rr(0.6, 0.85) }, { f: 0.5, side: 1, size: rr(0.55, 0.8) }];
        if (s.h > 90) leavesDef.push({ f: 0.2, side: 1, size: rr(0.7, 0.9) });
        var pl = Plant(s.back ? layerBack : layerFront, {
          x: x, h: s.h, lean: rr(-12, 12), bend: rr(-8, 8), sw: r1(1.8 + s.R * 0.1), R: s.R, pal: s.pal,
          leaves: leavesDef, amp: r1(rr(1.2, 2.4)), dur: r1(rr(4.2, 6.6)), delay: r1(rr(0, 5)),
          start: 4.06 + ds * 0.5 + rr(0, 0.08), dur2: 0.4
        });
        plants.push(pl);
      });

      // 中央第一朵花
      var main = Plant(layerMain, {
        x: 160, h: 125, lean: 4, bend: 7, sw: 4.4, R: 27, pal: 'purple',
        leaves: [
          { f: 0.07, side: -1, size: 0.75 }, { f: 0.09, side: 1, size: 0.72 },
          { f: 0.26, side: -1, size: 1.0 }, { f: 0.38, side: 1, size: 1.05 },
          { f: 0.52, side: -1, size: 0.95 }, { f: 0.64, side: 1, size: 0.9 },
          { f: 0.78, side: -1, size: 0.75 }
        ],
        amp: 1.3, dur: 6.2, delay: 1.5, start: 0, dur2: 1
      });

      // 光點（花園長成後，慢慢飄起）
      var lights = mk('g', { opacity: 0 }, svg);
      for (var l = 0; l < 9; l++) {
        var dot = mk('circle', { cx: r1(rr(30, 290)), cy: r1(rr(80, 190)), r: r1(rr(1.2, 2.2)), fill: '#fff0b8' }, lights);
        dot.setAttribute('class', 'mote');
        dot.style.animationDuration = r1(rr(5, 9)) + 's';
        dot.style.animationDelay = '-' + r1(rr(0, 8)) + 's';
      }

      function set(p) {
        // 種子與根
        var sw = c01(p / 0.6);
        seedInner.setAttribute('transform', 'scale(' + r1((1 + 0.14 * sw) * 100) / 100 + ')');
        seedGlow.setAttribute('opacity', r1(0.32 * c01(p / 0.25) * (1 - c01((p - 1.2) / 0.6)) * 100) / 100);
        seedG.setAttribute('opacity', r1((1 - 0.7 * c01((p - 1.2) / 1.2)) * 100) / 100);
        for (var i = 0; i < roots.length; i++) {
          var rp = eio((p - roots[i].s) / 0.9);
          roots[i].el.setAttribute('opacity', rp > 0.002 ? 1 : 0);
          roots[i].el.setAttribute('stroke-dashoffset', r1((1 - rp) * 1000) / 1000);
        }
        // 中央主莖：發芽 → 抽枝 → 長葉，之後含苞、開花
        main.update(eio((p - 0.45) / 2.05), eio((p - 2.5) / 0.5), eio((p - 3) / 1));
        // 其他花與小草：從中心向外蔓延
        for (var j = 0; j < plants.length; j++) {
          var q = (p - plants[j].start) / plants[j].dur;
          plants[j].update(eio(q / 0.6), eio((q - 0.45) / 0.2), eio((q - 0.6) / 0.4));
        }
        for (var k = 0; k < blades.length; k++) blades[k].set((p - blades[k].start) / blades[k].dur);
        lights.setAttribute('opacity', r1(eio((p - 4.3) / 0.6) * 100) / 100);
      }
      set(0);
      return { set: set };
    }

    var $ = function (id) { return document.getElementById(id); };
    var els = {
      total: $('garden-total'), stageName: $('garden-stage-name'), bar: $('garden-bar'), fill: $('garden-fill'),
      banner: $('garden-banner'), error: $('garden-error'),
      retry: $('garden-retry'), plant: $('plant'), glow: $('garden-glow')
    };
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var lastLoad = 0;
    var loading = false;

    function stageIndexFor(total) {
      var idx = 0;
      for (var i = 0; i < GARDEN.STAGES.length; i++) { if (total >= GARDEN.STAGES[i].min) idx = i; }
      return idx;
    }

    var scene = buildScene(els.plant);
    var grow = { p: 0, target: 0, raf: 0, visible: false };

    function setP(p) {
      grow.p = p;
      scene.set(p);
      els.glow.style.opacity = String(0.3 + 0.7 * Math.min(1, p / 4));
    }
    function runTo() {
      cancelAnimationFrame(grow.raf);
      var from = grow.p, to = grow.target;
      if (Math.abs(to - from) < 0.001) return;
      // 走得越遠，花的時間越長（約 1~12 秒）；全程慢—快—慢
      var dur = Math.max(900, Math.min(12000, Math.abs(to - from) * 2400 + 800));
      var t0 = null;
      function step(ts) {
        if (t0 === null) t0 = ts;
        var u = Math.min(1, (ts - t0) / dur);
        var e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
        setP(from + (to - from) * e);
        if (u < 1) grow.raf = requestAnimationFrame(step); else setP(to);
      }
      grow.raf = requestAnimationFrame(step);
    }
    function growTo(p, snap) {
      grow.target = p;
      if (reduceMotion || snap) { cancelAnimationFrame(grow.raf); setP(p); return; }
      if (grow.visible) runTo();
    }
    // 畫面捲到花園時才開始長
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) {
        if (entries[0].isIntersecting && !grow.visible) { grow.visible = true; if (!reduceMotion) runTo(); }
      }, { threshold: 0.4 }).observe(els.plant);
    } else {
      grow.visible = true;
    }

    function formatNum(n) { return Number(n).toLocaleString('zh-TW'); }

    function animateNumber(to) {
      if (reduceMotion || to === 0) { els.total.textContent = formatNum(to); return; }
      var start = null, dur = 900;
      function step(ts) {
        if (start === null) start = ts;
        var p = Math.min(1, (ts - start) / dur);
        els.total.textContent = formatNum(Math.round(to * (1 - Math.pow(1 - p, 3))));
        if (p < 1) requestAnimationFrame(step); else els.total.textContent = formatNum(to);
      }
      requestAnimationFrame(step);
    }

    function render(total) {
      var idx = stageIndexFor(total);
      var cur = GARDEN.STAGES[idx];
      var next = GARDEN.STAGES[idx + 1];
      var pct;
      var span = next ? (next.min - cur.min) : (cur.full ? (cur.full - cur.min) : 0);
      var frac = span > 0 ? Math.max(0, Math.min(1, (total - cur.min) / span)) : 1;
      pct = frac * 100;
      pct = Math.max(0, Math.min(100, pct));

      growTo(idx + frac);
      els.plant.setAttribute('aria-label', '守望花園：' + cur.label);
      animateNumber(total);
      els.stageName.textContent = cur.label;
      els.fill.style.width = pct.toFixed(1) + '%';
      els.bar.setAttribute('aria-valuenow', String(Math.round(pct)));
      els.bar.setAttribute('aria-valuetext', next ? ('已完成 ' + Math.round(pct) + '%') : '持續成長中');
      els.error.classList.add('hidden');

      // 達成新階段時，顯示簡短鼓勵訊息（只在比上次來訪更高的階段才顯示）
      var seen = null;
      try { seen = localStorage.getItem('tbc_garden_stage'); } catch (e) {}
      var seenIdx = -1;
      for (var i = 0; i < GARDEN.STAGES.length; i++) { if (GARDEN.STAGES[i].id === seen) seenIdx = i; }
      if (seenIdx >= 0 && idx > seenIdx) {
        els.banner.textContent = GARDEN.BANNER;
        els.banner.classList.remove('hidden');
      } else {
        els.banner.classList.add('hidden');
      }
      try { localStorage.setItem('tbc_garden_stage', cur.id); } catch (e) {}
    }

    function renderFailure() {
      // 讀取失敗：維持穩定的預設畫面（播種），不顯示任何數字或進度
      growTo(0, true);
      els.total.textContent = '—';
      els.stageName.textContent = '暫時無法顯示';
      els.fill.style.width = '0%';
      els.bar.removeAttribute('aria-valuenow');
      els.bar.setAttribute('aria-valuetext', '無法讀取');
      els.banner.classList.add('hidden');
      els.error.classList.remove('hidden');
    }

    function renderLoading() {
      els.stageName.textContent = '載入中';
      els.total.classList.add('garden-skeleton');
      els.error.classList.add('hidden');
    }

    function load() {
      if (loading) return;
      loading = true;
      renderLoading();
      var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, GARDEN.TIMEOUT_MS);
      fetch(GARDEN.SUPABASE_URL + '/rest/v1/rpc/' + GARDEN.RPC_NAME, {
        method: 'POST',
        headers: { 'apikey': GARDEN.SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: '{}',
        signal: ctrl ? ctrl.signal : undefined
      })
        .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
        .then(function (data) {
          var n = Number(data);
          if (data === null || typeof data === 'object' || !isFinite(n) || n < 0) throw new Error('bad data');
          lastLoad = Date.now();
          els.total.classList.remove('garden-skeleton');
          render(Math.floor(n));
        })
        .catch(function (err) {
          console.error('讀取禱告回應總數失敗:', err);
          els.total.classList.remove('garden-skeleton');
          renderFailure();
        })
        .then(function () { clearTimeout(timer); loading = false; });
    }

    els.retry.addEventListener('click', load);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && lastLoad && Date.now() - lastLoad > GARDEN.REFRESH_AFTER_MS) load();
    });
    load();
  })();
  </script>
</body>
</html>
