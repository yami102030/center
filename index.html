<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TBC Together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
                    colors: {
                        indigo: {50: '#f7eefc', 100: '#eddaf8', 200: '#d9afef', 300: '#c17ee6', 400: '#a747db', 500: '#941fd3', 600: '#8806ce', 700: '#7205ad', 800: '#5c048c', 900: '#49036f'},
                        emerald: {50: '#f6faf5', 100: '#ecf4ea', 200: '#d7e8d3', 300: '#bddab8', 400: '#a2ca9a', 500: '#8ebe84', 600: '#81b776', 700: '#6c9a63', 800: '#587c50', 900: '#466340'},
                    },
  } } }
</script>
<style>
  :root{ --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --sub:#64748b; --border:#f1f5f9; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0b1120; --card:#1e293b; --text:#f1f5f9; --sub:#94a3b8; --border:#334155; }
  }
  :root[data-theme="dark"]{ --bg:#0b1120; --card:#1e293b; --text:#f1f5f9; --sub:#94a3b8; --border:#334155; }
  html,body{ height:100%; }
  body{
    background:var(--bg); color:var(--text);
    font-family:'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .sub{ color:var(--sub); }
  .entry-icon{ color:#8806ce; transition: transform .2s ease; }
  .entry:hover .entry-icon, .entry:focus-visible .entry-icon{ transform: translateY(-3px); }
  .entry:active .entry-icon{ transform: scale(.92); }
  .entry:focus-visible{ outline: 2px solid #8806ce; outline-offset: 4px; border-radius: .75rem; }
  @media (prefers-reduced-motion: reduce){ .entry-icon{ transition:none; } }

  /* ===== 守望花園 ===== */
  .garden-card{ background:var(--card); border:1px solid var(--border); box-shadow:0 4px 20px -2px rgba(136,6,206,.10); }
  .garden-track{ background:rgba(100,116,139,.20); }
  .garden-fill{ background:linear-gradient(90deg,#8806ce,#81b776); transition:width .8s ease; }
  .garden-glow{ background:radial-gradient(closest-side, rgba(193,126,230,.28), rgba(129,183,118,.12) 70%, transparent); }
  .stage-off{ display:none; }
  .stage{ transform-origin:100px 160px; animation:grow-in .9s ease-out both; }
  .sway{ transform-origin:100px 160px; animation:sway 5s ease-in-out infinite alternate; }
  .petals{ transform-origin:100px 66px; animation:bloom 1.4s ease-out both; }
  @keyframes grow-in{ from{ opacity:0; transform:scale(.85); } to{ opacity:1; transform:none; } }
  @keyframes sway{ from{ transform:rotate(-1.6deg); } to{ transform:rotate(1.6deg); } }
  @keyframes bloom{ from{ transform:scale(.3); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .garden-skeleton{ animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 50%{ opacity:.45; } }
  @media (prefers-reduced-motion: reduce){
    .stage, .sway, .petals, .garden-skeleton{ animation:none; }
    .garden-fill{ transition:none; }
  }
</style>
</head>
<body class="min-h-[100dvh] flex flex-col items-center p-6 pt-10 sm:pt-20 pb-10">
  <main class="w-full max-w-3xl">

    <div class="text-center mb-12">
      <h1 class="text-4xl sm:text-5xl font-black tracking-tight">TBC Together</h1>
      <p class="mt-3 text-lg font-bold sub">一起禱告、一起服事、一起成長</p>
    </div>

    <!-- 入口圖示：固定三欄，手機上也維持同一排；之後增加入口時，複製一個 <a class="entry ..."> 並把 grid-cols-3 改成對應數字 -->
    <nav aria-label="功能入口" class="grid grid-cols-3 gap-x-2 sm:gap-x-6 max-w-sm sm:max-w-md mx-auto">

      <a href="./prayer.html" class="entry group flex flex-col items-center gap-2 min-w-0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="entry-icon w-9 h-9 sm:w-10 sm:h-10" aria-hidden="true">
          <path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"></path>
        </svg>
        <span class="text-sm sm:text-base font-bold text-center whitespace-nowrap">我的禱告</span>
      </a>

      <a href="./search.html" class="entry group flex flex-col items-center gap-2 min-w-0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="entry-icon w-9 h-9 sm:w-10 sm:h-10" aria-hidden="true">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
          <path d="M16 3.128a4 4 0 0 1 0 7.744"></path>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
          <circle cx="9" cy="7" r="4"></circle>
        </svg>
        <span class="text-sm sm:text-base font-bold text-center whitespace-nowrap">我的服事</span>
      </a>

      <a href="./manager.html" class="entry group flex flex-col items-center gap-2 min-w-0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="entry-icon w-9 h-9 sm:w-10 sm:h-10" aria-hidden="true">
          <path d="M10 15H6a4 4 0 0 0-4 4v2"></path>
          <path d="m14.305 16.53.923-.382"></path><path d="m15.228 13.852-.923-.383"></path>
          <path d="m16.852 12.228-.383-.923"></path><path d="m16.852 17.772-.383.924"></path>
          <path d="m19.148 12.228.383-.923"></path><path d="m19.53 18.696-.382-.924"></path>
          <path d="m20.772 13.852.924-.383"></path><path d="m20.772 16.148.924.383"></path>
          <circle cx="18" cy="15" r="3"></circle>
          <circle cx="9" cy="7" r="4"></circle>
        </svg>
        <span class="text-sm sm:text-base font-bold text-center whitespace-nowrap">個人設定</span>
      </a>

    </nav>

    <!-- 守望花園：全教會累積的有效禱告回應，決定植物長到哪個階段 -->
    <section id="garden" aria-labelledby="garden-title" class="mt-14 sm:mt-16">
      <div class="text-center mb-5">
        <h2 id="garden-title" class="text-2xl sm:text-3xl font-black tracking-tight">守望花園</h2>
        <p class="mt-2 text-base font-bold sub">一起澆灌禱告的種子</p>
      </div>

      <div class="garden-card rounded-[2rem] p-6 sm:p-8">
        <div class="relative mx-auto w-full max-w-[240px] aspect-square">
          <div class="garden-glow absolute inset-0 rounded-full" aria-hidden="true"></div>
          <svg id="plant" viewBox="0 0 200 200" class="relative w-full h-full" role="img" aria-label="守望花園的植物">
            <!-- 土壤 -->
            <ellipse cx="100" cy="168" rx="62" ry="14" fill="#8b6a4c"></ellipse>
            <path d="M46 166 Q100 138 154 166 Z" fill="#a07c58"></path>

            <!-- 第一階段：播種 -->
            <g class="stage" data-stage="seed">
              <ellipse cx="100" cy="153" rx="9" ry="6" fill="#6b4f36" transform="rotate(-15 100 153)"></ellipse>
              <ellipse cx="97" cy="151" rx="3" ry="1.6" fill="#8d6c4d" transform="rotate(-15 97 151)"></ellipse>
            </g>

            <!-- 第二階段：發芽 -->
            <g class="stage stage-off" data-stage="sprout">
              <g class="sway">
                <path d="M100 156 C100 146 100 138 100 128" stroke="#6c9a63" stroke-width="4" stroke-linecap="round" fill="none"></path>
                <path d="M100 134 C88 134 80 126 80 116 C92 116 100 122 100 134Z" fill="#81b776"></path>
                <path d="M100 130 C112 130 120 122 120 112 C108 112 100 118 100 130Z" fill="#8ebe84"></path>
              </g>
            </g>

            <!-- 第三階段：成長 -->
            <g class="stage stage-off" data-stage="grow">
              <g class="sway">
                <path d="M100 156 C100 130 100 100 100 76" stroke="#6c9a63" stroke-width="5" stroke-linecap="round" fill="none"></path>
                <path d="M100 140 C84 140 74 130 74 118 C90 118 100 128 100 140Z" fill="#81b776"></path>
                <path d="M100 136 C116 136 126 126 126 114 C110 114 100 124 100 136Z" fill="#8ebe84"></path>
                <path d="M100 116 C84 116 74 106 74 94 C90 94 100 104 100 116Z" fill="#8ebe84"></path>
                <path d="M100 112 C116 112 126 102 126 90 C110 90 100 100 100 112Z" fill="#81b776"></path>
                <path d="M100 94 C86 94 78 86 78 76 C92 76 100 84 100 94Z" fill="#81b776"></path>
                <path d="M100 90 C114 90 122 82 122 72 C108 72 100 80 100 90Z" fill="#8ebe84"></path>
                <ellipse cx="100" cy="66" rx="7" ry="11" fill="#c17ee6"></ellipse>
              </g>
            </g>

            <!-- 第四階段：開花 -->
            <g class="stage stage-off" data-stage="bloom">
              <g class="sway">
                <path d="M100 156 C100 130 100 100 100 82" stroke="#6c9a63" stroke-width="5" stroke-linecap="round" fill="none"></path>
                <path d="M100 140 C84 140 74 130 74 118 C90 118 100 128 100 140Z" fill="#81b776"></path>
                <path d="M100 136 C116 136 126 126 126 114 C110 114 100 124 100 136Z" fill="#8ebe84"></path>
                <path d="M100 116 C84 116 74 106 74 94 C90 94 100 104 100 116Z" fill="#8ebe84"></path>
                <path d="M100 112 C116 112 126 102 126 90 C110 90 100 100 100 112Z" fill="#81b776"></path>
                <g class="petals">
                  <ellipse cx="100" cy="49" rx="9" ry="17" fill="#a747db"></ellipse>
                  <ellipse cx="100" cy="49" rx="9" ry="17" fill="#c17ee6" transform="rotate(45 100 66)"></ellipse>
                  <ellipse cx="100" cy="49" rx="9" ry="17" fill="#a747db" transform="rotate(90 100 66)"></ellipse>
                  <ellipse cx="100" cy="49" rx="9" ry="17" fill="#c17ee6" transform="rotate(135 100 66)"></ellipse>
                  <ellipse cx="100" cy="49" rx="9" ry="17" fill="#a747db" transform="rotate(180 100 66)"></ellipse>
                  <ellipse cx="100" cy="49" rx="9" ry="17" fill="#c17ee6" transform="rotate(225 100 66)"></ellipse>
                  <ellipse cx="100" cy="49" rx="9" ry="17" fill="#a747db" transform="rotate(270 100 66)"></ellipse>
                  <ellipse cx="100" cy="49" rx="9" ry="17" fill="#c17ee6" transform="rotate(315 100 66)"></ellipse>
                  <circle cx="100" cy="66" r="10" fill="#f6c453"></circle>
                </g>
              </g>
            </g>
          </svg>
        </div>

        <div class="mt-4 text-center" aria-live="polite">
          <p class="text-sm font-bold sub">全教會禱告累計</p>
          <p class="mt-1 font-black tracking-tight leading-none">
            <span id="garden-total" class="text-5xl sm:text-6xl tabular-nums">—</span>
            <span class="text-lg font-bold sub ml-1">次</span>
          </p>
          <p id="garden-stage" class="mt-3 inline-flex items-center gap-2 text-sm font-bold">
            <span class="px-3 py-1 rounded-full bg-indigo-100 text-indigo-700" id="garden-stage-name">載入中</span>
          </p>
        </div>

        <div class="mt-5 max-w-md mx-auto">
          <div class="garden-track h-3 rounded-full overflow-hidden" role="progressbar" id="garden-bar" aria-label="花園成長進度" aria-valuemin="0" aria-valuemax="100">
            <div id="garden-fill" class="garden-fill h-full rounded-full" style="width:0%"></div>
          </div>
        </div>

        <p id="garden-banner" class="hidden mt-5 mx-auto max-w-md text-center text-sm font-bold rounded-xl px-4 py-3 bg-emerald-100 text-emerald-800"></p>

        <div id="garden-error" class="hidden mt-5 text-center" role="alert">
          <p class="text-sm font-bold text-red-600">暫時無法讀取禱告回應次數，請稍後再試。</p>
          <button id="garden-retry" type="button" class="mt-3 px-5 py-2 rounded-xl text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 transition-colors">重新載入</button>
        </div>

        <div class="mt-6 text-center">
          <a href="./prayer.html" class="inline-flex items-center gap-1 text-indigo-600 font-bold text-sm hover:underline">去為彼此禱告 &rarr;</a>
        </div>
      </div>
    </section>
  </main>

  <script>
  (function () {
    // ==========================================
    // 守望花園設定：所有數字與文字都集中在這裡，要調整只改這一處
    // ==========================================
    var GARDEN = {
      SUPABASE_URL: "https://jcepavwocdujoeoqxvsd.supabase.co",
      SUPABASE_KEY: "sb_publishable_Tj2n8e3yY1HyvaFzXRyO_w_PWrVFB7E",
      RPC_NAME: "get_prayer_total",   // 資料庫函式：只回傳「已核准且公開」貼文的回應總數
      TIMEOUT_MS: 8000,
      REFRESH_AFTER_MS: 60000,        // 回到分頁時，超過這個時間才重新讀取
      // 階段：min 是該階段起算的次數（依小到大排列）
      STAGES: [
        { id: 'seed',   name: '播種', min: 0,    note: '每一次禱告，都是一滴滋養生命的水。' },
        { id: 'sprout', name: '發芽', min: 100,  note: '嫩芽探出頭了，謝謝大家一同守望。' },
        { id: 'grow',   name: '成長', min: 500,  note: '花園越長越茂盛，願我們在禱告中一同成長。' },
        { id: 'bloom',  name: '開花', min: 1000, note: '花開了！感謝神，也感謝每一位一同禱告的你。' }
      ]
    };

    var $ = function (id) { return document.getElementById(id); };
    var els = {
      total: $('garden-total'), stageName: $('garden-stage-name'), bar: $('garden-bar'), fill: $('garden-fill'),
      banner: $('garden-banner'), error: $('garden-error'),
      retry: $('garden-retry'), plant: $('plant')
    };
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var lastLoad = 0;
    var loading = false;

    function stageIndexFor(total) {
      var idx = 0;
      for (var i = 0; i < GARDEN.STAGES.length; i++) { if (total >= GARDEN.STAGES[i].min) idx = i; }
      return idx;
    }

    function showStage(id) {
      var groups = els.plant.querySelectorAll('[data-stage]');
      for (var i = 0; i < groups.length; i++) {
        groups[i].classList.toggle('stage-off', groups[i].getAttribute('data-stage') !== id);
      }
    }

    function formatNum(n) { return Number(n).toLocaleString('zh-TW'); }

    function animateNumber(to) {
      if (reduceMotion || to === 0) { els.total.textContent = formatNum(to); return; }
      var start = null, dur = 900;
      function step(ts) {
        if (start === null) start = ts;
        var p = Math.min(1, (ts - start) / dur);
        els.total.textContent = formatNum(Math.round(to * (1 - Math.pow(1 - p, 3))));
        if (p < 1) requestAnimationFrame(step); else els.total.textContent = formatNum(to);
      }
      requestAnimationFrame(step);
    }

    function render(total) {
      var idx = stageIndexFor(total);
      var cur = GARDEN.STAGES[idx];
      var next = GARDEN.STAGES[idx + 1];
      var pct;
      if (next) { pct = (total - cur.min) / (next.min - cur.min) * 100; } else { pct = 100; }
      pct = Math.max(0, Math.min(100, pct));

      showStage(cur.id);
      animateNumber(total);
      els.stageName.textContent = '目前階段：' + cur.name;
      els.fill.style.width = pct.toFixed(1) + '%';
      els.bar.setAttribute('aria-valuenow', String(Math.round(pct)));
      els.bar.setAttribute('aria-valuetext', next ? ('已完成 ' + Math.round(pct) + '%') : '持續成長中');
      els.error.classList.add('hidden');

      // 達成新階段時，顯示簡短鼓勵訊息（只在比上次來訪更高的階段才顯示）
      var seen = null;
      try { seen = localStorage.getItem('tbc_garden_stage'); } catch (e) {}
      var seenIdx = -1;
      for (var i = 0; i < GARDEN.STAGES.length; i++) { if (GARDEN.STAGES[i].id === seen) seenIdx = i; }
      if (seenIdx >= 0 && idx > seenIdx) {
        els.banner.textContent = '花園進入新的階段：' + cur.name + '！謝謝大家一同守望。';
        els.banner.classList.remove('hidden');
      } else {
        els.banner.classList.add('hidden');
      }
      try { localStorage.setItem('tbc_garden_stage', cur.id); } catch (e) {}
    }

    function renderFailure() {
      // 讀取失敗：維持穩定的預設畫面（播種），不顯示任何數字或進度
      showStage(GARDEN.STAGES[0].id);
      els.total.textContent = '—';
      els.stageName.textContent = '暫時無法顯示';
      els.fill.style.width = '0%';
      els.bar.removeAttribute('aria-valuenow');
      els.bar.setAttribute('aria-valuetext', '無法讀取');
      els.banner.classList.add('hidden');
      els.error.classList.remove('hidden');
    }

    function renderLoading() {
      els.stageName.textContent = '載入中';
      els.total.classList.add('garden-skeleton');
      els.error.classList.add('hidden');
    }

    function load() {
      if (loading) return;
      loading = true;
      renderLoading();
      var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, GARDEN.TIMEOUT_MS);
      fetch(GARDEN.SUPABASE_URL + '/rest/v1/rpc/' + GARDEN.RPC_NAME, {
        method: 'POST',
        headers: { 'apikey': GARDEN.SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: '{}',
        signal: ctrl ? ctrl.signal : undefined
      })
        .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
        .then(function (data) {
          var n = Number(data);
          if (data === null || typeof data === 'object' || !isFinite(n) || n < 0) throw new Error('bad data');
          lastLoad = Date.now();
          els.total.classList.remove('garden-skeleton');
          render(Math.floor(n));
        })
        .catch(function (err) {
          console.error('讀取禱告回應總數失敗:', err);
          els.total.classList.remove('garden-skeleton');
          renderFailure();
        })
        .then(function () { clearTimeout(timer); loading = false; });
    }

    els.retry.addEventListener('click', load);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && lastLoad && Date.now() - lastLoad > GARDEN.REFRESH_AFTER_MS) load();
    });
    load();
  })();
  </script>
</body>
</html>
